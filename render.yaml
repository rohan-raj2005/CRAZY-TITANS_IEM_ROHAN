services:
  # 1. Backend Web Service
  - type: web
    name: studypulse-api
    env: node
    plan: free
    buildCommand: npm ci && npm run train
    startCommand: npm start
    rootDir: backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

  # 2. Frontend Static Site
  - type: web
    name: studypulse-ui
    env: static
    plan: free
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: studypulse-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
